services:
  web:
    build: .
    env_file: .env
    volumes:
      - ./certs/supabase-ca.crt:/app/certs/supabase-ca.crt:ro
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: 3000
    ports:
      - "127.0.0.1:3000:3000"
    init: true
    restart: unless-stopped
    stop_grace_period: 30s
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
  worker:
    build: .
    command: ["node", "--conditions=react-server", "--import", "tsx", "scripts/monitor-worker.ts"]
    env_file: .env
    volumes:
      - ./certs/supabase-ca.crt:/app/certs/supabase-ca.crt:ro
    environment:
      NODE_ENV: production
      WORKER_HEARTBEAT_PATH: /tmp/positionguard-worker/heartbeat
    init: true
    restart: unless-stopped
    stop_grace_period: 30s
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "const f=process.env.WORKER_HEARTBEAT_PATH;require('fs').stat(f,(e,s)=>{if(e||Date.now()-s.mtimeMs>300000)process.exit(1)})",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 90s
